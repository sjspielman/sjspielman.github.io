name: Update Substack feed

on:
  schedule:
    - cron: "0 12 * * *"  # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feed
        run: python3 .github/scripts/fetch_substack.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/_data/substack.json
          git diff --staged --quiet || (git commit -m "Update Substack feed" && git push)
